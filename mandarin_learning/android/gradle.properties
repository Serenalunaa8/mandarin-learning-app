org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9.x uses built-in Kotlin support by default; keeping the legacy flags disabled causes
# incompatibility with the current Android Gradle Plugin and Kotlin toolchain.
android.newDsl=true
android.builtInKotlin=true
